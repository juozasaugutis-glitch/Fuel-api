<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Degaliniu Kainu Palyginimas</title>
    <link rel="stylesheet" href="https://leaflet.js.org/examples/css/leaflet.css" />
    <script src="https://leaflet.js.org/examples/js/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .info-banner {
            background: #e3f2fd;
            color: #1565c0;
            padding: 12px 20px;
            border-left: 4px solid #1976d2;
            font-size: 0.9em;
        }
        
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 30px;
        }
        
        .search-panel {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .search-panel h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            flex: 1;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        button.secondary {
            background: #6c757d;
        }
        
        .map-container {
            border-radius: 8px;
            overflow: hidden;
            height: 400px;
            border: 1px solid #ddd;
        }
        
        #map {
            height: 100%;
            width: 100%;
        }
        
        .results {
            grid-column: 1 / -1;
            margin-top: 20px;
        }
        
        .results h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .station-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #28a745;
            transition: all 0.3s;
        }
        
        .station-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: translateX(5px);
        }
        
        .station-card h3 {
            color: #333;
            margin-bottom: 8px;
        }
        
        .station-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.95em;
            color: #666;
        }
        
        .price-badge {
            background: #28a745;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
        }
        
        .distance-badge {
            background: #007bff;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-left: 5px;
        }
        
        .best-offer {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            grid-column: 1 / -1;
        }
        
        .best-offer h3 {
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            display: none;
        }
        
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            display: none;
        }
        
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⛽ Degaliniu Kainu Palyginimas</h1>
            <p>Raskite pigiausią degalinę šalia jūsų su tikrais duomenimis</p>
        </header>
        
        <div class="info-banner">
            📊 Duomenys iš Lietuvos energetikos agentūros (LEA) per fuel-prices.eu API
        </div>
        
        <div class="content">
            <div class="search-panel">
                <h2>Paieška</h2>
                
                <div class="form-group">
                    <label for="location-select">Pasirinkite miestą:</label>
                    <select id="location-select">
                        <option value="">-- Pasirinkite lokacija --</option>
                        <option value="vilnius">Vilnius</option>
                        <option value="kaunas">Kaunas</option>
                        <option value="klaipeda">Klaipėda</option>
                        <option value="siauliai">Šiauliai</option>
                        <option value="panevezys">Panevėžys</option>
                        <option value="custom">Pasirinktinė lokacija</option>
                    </select>
                </div>
                
                <div id="custom-coords" style="display:none;">
                    <div class="form-group">
                        <label for="latitude">Platuma:</label>
                        <input type="number" id="latitude" placeholder="54.6872" step="0.0001">
                    </div>
                    
                    <div class="form-group">
                        <label for="longitude">Ilguma:</label>
                        <input type="number" id="longitude" placeholder="25.2797" step="0.0001">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="fuel-type">Kuro tipas:</label>
                    <select id="fuel-type">
                        <option value="E5">Benzinas 95 (E5)</option>
                        <option value="E10">Benzinas 98 (E10)</option>
                        <option value="B7">Dyzelis (B7)</option>
                        <option value="LPG">LPG</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="radius">Paieškos spindulys (km):</label>
                    <input type="number" id="radius" value="50" min="5" max="200" step="5">
                </div>
                
                <div class="button-group">
                    <button id="search-btn" onclick="searchStations()">🔍 Ieškoti</button>
                    <button class="secondary" onclick="getUserLocation()">📍 Mano lokacija</button>
                </div>
                
                <div class="success" id="success"></div>
                <div class="error" id="error"></div>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    Ieškoma degalinių...
                </div>
            </div>
            
            <div class="map-container">
                <div id="map"></div>
            </div>
            
            <div class="results" id="results" style="display:none;">
                <div id="best-offer"></div>
                <h2>Degalinės šalia jūsų</h2>
                <div id="stations-list"></div>
            </div>
        </div>
    </div>
    
    <script>
        const LOCATIONS = {
            vilnius: [54.6872, 25.2797],
            kaunas: [54.8973, 23.9021],
            klaipeda: [55.7206, 21.1441],
            siauliai: [55.9311, 23.3162],
            panevezys: [55.7386, 24.3633]
        };
        
        const FUEL_TYPE_NAMES = {
            'E5': 'Benzinas 95',
            'E10': 'Benzinas 98',
            'B7': 'Dyzelis',
            'LPG': 'LPG'
        };
        
        let map;
        let userMarker;
        let stationMarkers = [];
        let allStations = [];
        
        // Apskaičiuoti atstumą (Haversine formulė)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Žemės spindulys km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }
        
        // Inicijalizuoti žemėlapį
        function initMap() {
            map = L.map('map').setView([54.6872, 25.2797], 10);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);
        }
        
        // Gauti duomenis iš fuel-prices.eu API
        async function fetchFuelPrices() {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('error').style.display = 'none';
                
                const response = await fetch('https://fuel-prices.eu/api/stations/');
                if (!response.ok) throw new Error(`API klaida: ${response.status}`);
                
                const data = await response.json();
                allStations = data.stations || [];
                
                showSuccess(`Sėkmingai įkelti ${allStations.length} degalinių`);
                console.log('Įkeltos degalinės:', allStations.length);
                
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                showError('Nepavyko įkelti duomenų iš API: ' + error.message);
                console.error('API klaida:', error);
                document.getElementById('loading').style.display = 'none';
                loadFallbackData();
            }
        }
        
        // Fallback duomenys jei API nepasiekiama
        function loadFallbackData() {
            showError('API nepasiekiama. Naudojami fallback duomenys.');
            allStations = [
                {name: "Statoil Vilnius", latitude: 54.6872, longitude: 25.2797, prices: {E5: 1.45, E10: 1.55, B7: 1.32, LPG: 0.65}},
                {name: "Shell Vilnius", latitude: 54.6900, longitude: 25.2800, prices: {E5: 1.47, E10: 1.57, B7: 1.29, LPG: 0.67}},
                {name: "OMV Vilnius", latitude: 54.6850, longitude: 25.2850, prices: {E5: 1.43, E10: 1.53, B7: 1.30, LPG: 0.66}},
                {name: "Lukoil Vilnius", latitude: 54.7000, longitude: 25.2600, prices: {E5: 1.42, E10: 1.52, B7: 1.31, LPG: 0.64}},
                {name: "Statoil Kaunas", latitude: 54.8973, longitude: 23.9021, prices: {E5: 1.44, E10: 1.54, B7: 1.31, LPG: 0.65}},
                {name: "Shell Kaunas", latitude: 54.9000, longitude: 23.9050, prices: {E5: 1.46, E10: 1.56, B7: 1.28, LPG: 0.68}},
            ];
        }
        
        // Rodyti klaidą
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 8000);
        }
        
        // Rodyti sėkmę
        function showSuccess(message) {
            const successDiv = document.getElementById('success');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }
        
        // Pasirinko lokacija
        document.getElementById('location-select').addEventListener('change', function(e) {
            const value = e.target.value;
            document.getElementById('custom-coords').style.display = value === 'custom' ? 'block' : 'none';
            
            if (value && value !== 'custom' && LOCATIONS[value]) {
                const [lat, lon] = LOCATIONS[value];
                document.getElementById('latitude').value = lat;
                document.getElementById('longitude').value = lon;
                map.setView([lat, lon], 11);
            }
        });
        
        // Gauti vartotojo lokacija
        function getUserLocation() {
            if (navigator.geolocation) {
                document.getElementById('loading').style.display = 'block';
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        document.getElementById('latitude').value = lat.toFixed(4);
                        document.getElementById('longitude').value = lon.toFixed(4);
                        document.getElementById('location-select').value = '';
                        map.setView([lat, lon], 12);
                        document.getElementById('loading').style.display = 'none';
                        showSuccess('Jūsų lokacija nustatyta');
                    },
                    function(error) {
                        showError('Nepavyko gauti jūsų lokacijos: ' + error.message);
                        document.getElementById('loading').style.display = 'none';
                    }
                );
            } else {
                showError('Jūsų naršyklė nepalaiko geolokacijos');
            }
        }
        
        // Ieškoti degalini��
        function searchStations() {
            const lat = parseFloat(document.getElementById('latitude').value);
            const lon = parseFloat(document.getElementById('longitude').value);
            const fuelType = document.getElementById('fuel-type').value;
            const radius = parseFloat(document.getElementById('radius').value);
            
            if (!lat || !lon) {
                showError('Prašome pasirinkti lokacija');
                return;
            }
            
            if (allStations.length === 0) {
                showError('Duomenys dar nėra įkelti. Pabandykite vėliau.');
                return;
            }
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('search-btn').disabled = true;
            
            setTimeout(() => {
                try {
                    // Filtruoti ir rūšiuoti degalines
                    const nearby = allStations
                        .map(station => ({
                            ...station,
                            distance_km: calculateDistance(lat, lon, station.latitude, station.longitude)
                        }))
                        .filter(station => 
                            station.distance_km <= radius && 
                            station.prices && 
                            station.prices[fuelType]
                        )
                        .map(station => ({
                            degaline: station.name,
                            kaina: station.prices[fuelType],
                            atstumas_km: parseFloat(station.distance_km.toFixed(2)),
                            latitude: station.latitude,
                            longitude: station.longitude
                        }))
                        .sort((a, b) => a.kaina - b.kaina);
                    
                    displayResults(nearby, lat, lon, fuelType);
                    showSuccess(`Rasta ${nearby.length} degalinių`);
                } catch (error) {
                    showError('Paieškos klaida: ' + error.message);
                    console.error('Paieškos klaida:', error);
                } finally {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('search-btn').disabled = false;
                }
            }, 500);
        }
        
        // Rodyti rezultatus
        function displayResults(stations, userLat, userLon, fuelType) {
            // Nuvalyti žemėlapį
            stationMarkers.forEach(marker => map.removeLayer(marker));
            stationMarkers = [];
            if (userMarker) map.removeLayer(userMarker);
            
            // Pridėti vartotojo žymę
            userMarker = L.circleMarker([userLat, userLon], {
                radius: 8,
                fillColor: "#667eea",
                color: "#fff",
                weight: 2,
                opacity: 1,
                fillOpacity: 0.8
            }).addTo(map).bindPopup('Jūsų lokacija');
            
            if (!stations || stations.length === 0) {
                showError('Nėra degalinių šalia jūsų');
                return;
            }
            
            const resultsDiv = document.getElementById('results');
            const stationsList = document.getElementById('stations-list');
            stationsList.innerHTML = '';
            
            // Rodyti geriausią pasiūlymą
            const bestStation = stations[0];
            const bestOfferDiv = document.getElementById('best-offer');
            bestOfferDiv.innerHTML = `
                <div class="best-offer">
                    <h3>🏆 Geriausia pasiūlyma!</h3>
                    <p><strong>${bestStation.degaline}</strong></p>
                    <p><strong>${bestStation.atstumas_km} km nuo jūsų</strong></p>
                    <p style="font-size: 1.3em; margin-top: 10px;">
                        <strong>€${bestStation.kaina.toFixed(2)}</strong> / ${FUEL_TYPE_NAMES[fuelType]}
                    </p>
                </div>
            `;
            
            // Rodyti visas degalines
            stations.slice(0, 10).forEach((station, index) => {
                const card = document.createElement('div');
                card.className = 'station-card';
                card.innerHTML = `
                    <h3>${index + 1}. ${station.degaline}</h3>
                    <div class="station-info">
                        <div>
                            <strong>Tipo:</strong> ${FUEL_TYPE_NAMES[fuelType]}
                        </div>
                        <div style="text-align: right;">
                            <span class="price-badge">€${station.kaina.toFixed(2)}</span><br>
                            <span class="distance-badge">${station.atstumas_km} km</span>
                        </div>
                    </div>
                `;
                stationsList.appendChild(card);
                
                // Pridėti žemėlapyje
                const marker = L.marker([station.latitude, station.longitude], {
                    title: station.degaline
                }).addTo(map);
                marker.bindPopup(`
                    <b>${station.degaline}</b><br>
                    €${station.kaina.toFixed(2)}<br>
                    ${station.atstumas_km} km
                `);
                stationMarkers.push(marker);
            });
            
            resultsDiv.style.display = 'block';
            
            // Zoom į visas žymes
            if (stationMarkers.length > 0) {
                const group = new L.featureGroup([userMarker, ...stationMarkers]);
                map.fitBounds(group.getBounds().pad(0.1));
            }
        }
        
        // Inicijalizuoti
        window.addEventListener('load', function() {
            initMap();
            fetchFuelPrices();
        });
    </script>
</body>
</html>
